name: Publish Windows installer release
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package the exact source and publish the one-click installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          archive="LocalAssetStudio-$tag-windows-source.zip"
          git archive --format=zip --output="$archive" HEAD
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Local Asset Studio $tag — TRELLIS and one-click setup" --notes-file CHANGELOG.md
          fi
          gh release upload "$tag" Install-LocalAssetStudio.bat "$archive" --clobber
