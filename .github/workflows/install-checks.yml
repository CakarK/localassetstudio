name: Windows installer contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal source-test dependencies (no GPU runtimes/models)
        run: python -m pip install numpy==1.26.4 trimesh==5.1.1 pillow==12.3.0 requests==2.34.2 Flask==3.1.3 jsonschema==4.26.0
      - name: Hash, resume, preservation and Windows PowerShell contracts
        run: python -m unittest tests.test_installation -v
      - name: Read-only full installation plan
        shell: powershell
        run: .\Install-LocalAssetStudio.ps1 -Plan
